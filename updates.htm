<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="/css/master.css">
    <title>⚙️ Backup Update Log</title>
    <style>
        .commit {
            margin-bottom: 1.2em;
        }
        .commit-date {
            font-size: 0.8em;
            opacity: 0.6;
        }
        .commit-msg {
            margin: 0.2em 0 0 0;
        }
        .commit-diff {
            font-size: 0.8em;
            margin: 0.2em 0 0 0;
        }
        .additions { color: #4caf50; }
        .deletions { color: #f44336; }
        .loading {
            opacity: 0.6;
        }
    </style>
</head>
<body>
<div class="t-container">
    <a href="/" class="back-btn">← Back</a>
    <h2>⚙️ Backup Update Log</h2>
    <p class="loading" id="status">Loading commits...</p>
    <div id="commits"></div>
    <button id="load-more" style="display:none;" onclick="loadMore()">Load More</button>
</div>
<script>
    const CACHE_KEY = 'goodbackup_commits';
    const CACHE_TTL = 60 * 60 * 1000; // 1 hour
    const PER_PAGE = 30;
    let currentPage = 1;

    function saveCache(commits, page, hasMore) {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), commits, page, hasMore }));
    }

    function renderCommits(commits) {
        document.getElementById('status').style.display = 'none';
        const container = document.getElementById('commits');
        commits.forEach(item => {
            const date = new Date(item.commit.author.date).toLocaleDateString('en-GB', {
                day: '2-digit', month: 'short', year: 'numeric'
            });
            const msg = item.commit.message.split('\n')[0];
            const add = item.stats ? item.stats.additions : 0;
            const del = item.stats ? item.stats.deletions : 0;
            const div = document.createElement('div');
            div.className = 'commit';
            div.innerHTML = `<p class="commit-date">${date}</p><p class="commit-msg">${msg}</p><p class="commit-diff"><span class="additions">+${add}</span> <span class="deletions">-${del}</span></p><hr class="dividera">`;
            container.appendChild(div);
        });
    }

    function setLoadMore(show) {
        document.getElementById('load-more').style.display = show ? 'block' : 'none';
    }

    function fetchPage(page) {
        setLoadMore(false);
        document.getElementById('status').style.display = 'block';
        document.getElementById('status').textContent = 'Loading...';
        return fetch(`https://api.github.com/repos/TR-ASHcoder/GOOD-BACK-UP/commits?per_page=${PER_PAGE}&page=${page}`)
            .then(r => r.json())
            .then(data => Promise.all(data.map(item => fetch(item.url).then(r => r.json()))))
            .then(commits => {
                document.getElementById('status').style.display = 'none';
                return { commits, hasMore: commits.length === PER_PAGE };
            });
    }

    function loadMore() {
        currentPage++;
        fetchPage(currentPage).then(({ commits, hasMore }) => {
            const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
            const all = (cached.commits || []).concat(commits);
            saveCache(all, currentPage, hasMore);
            renderCommits(commits);
            setLoadMore(hasMore);
        }).catch(() => {
            document.getElementById('status').style.display = 'block';
            document.getElementById('status').textContent = 'Failed to load more.';
            setLoadMore(true);
        });
    }

    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
        const { ts, commits, page, hasMore } = JSON.parse(cached);
        if (Date.now() - ts < CACHE_TTL) {
            currentPage = page || 1;
            renderCommits(commits);
            setLoadMore(hasMore !== false);
        } else {
            localStorage.removeItem(CACHE_KEY);
        }
    }

    if (!document.getElementById('commits').children.length) {
        fetchPage(1).then(({ commits, hasMore }) => {
            saveCache(commits, 1, hasMore);
            renderCommits(commits);
            setLoadMore(hasMore);
        }).catch(() => {
            document.getElementById('status').textContent = 'Failed to load commits.';
        });
    }
</script>
</body>
</html>
